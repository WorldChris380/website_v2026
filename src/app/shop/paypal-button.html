<div class="paypal-box">
  @if (isLoading) {
    <div class="paypal-loading">
      <span class="spinner-sm"></span>
    </div>
  }
  @if (!isLoading && loadError) {
    <div class="paypal-error">{{ loadError }}</div>
  }
  @if (!isLoading && !isPlaceholder) {
    <div id="paypal-btn-container"></div>
  }
  @if (isPlaceholder) {
    <p class="hint">PayPal Client ID not configured. Set <code>paypalClientId</code> in
    <code>environment.ts</code>.
  </p>
}
</div>
