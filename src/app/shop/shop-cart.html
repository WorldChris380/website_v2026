<div class="cart-drawer" [class.open]="isOpen()">
    <div class="cart-header">
        <div>
            <p class="eyebrow">Shop</p>
            <h3>{{ t('selection') }}</h3>
        </div>
        <button class="close" (click)="toggle()">✕</button>
    </div>

    <div class="cart-body" *ngIf="totalQuantity > 0; else emptyState">
        <div class="cart-item" *ngFor="let item of items">
            <img [src]="item.imageUrl" [alt]="item.title">
            <div class="info">
                <p class="title">{{ item.title }}</p>
                <p class="price">{{ item.price | number:'1.2-2' }} {{ item.currency }}</p>
                <div class="qty">
                    <button (click)="decrement(item.id)">−</button>
                    <span>{{ item.quantity }}</span>
                    <button (click)="increment(item.id)">+</button>
                </div>
            </div>
            <button class="remove" (click)="remove(item.id)">{{ t('remove') }}</button>
        </div>
    </div>

    <ng-template #emptyState>
        <div class="empty">
            <p>{{ t('empty') }}</p>
        </div>
    </ng-template>

    <div class="cart-footer">
        <div class="total">
            <span>{{ t('total') }}</span>
            <strong>{{ total | number:'1.2-2' }} EUR</strong>
        </div>
        <label class="certificate-owner" *ngIf="totalQuantity > 0">
            <span>{{ t('owner') }}</span>
            <input type="text" [ngModel]="certificateOwner" (ngModelChange)="onCertificateOwnerChange($event)"
                [placeholder]="t('ownerPlaceholder')" />
        </label>
        <app-paypal-button *ngIf="totalQuantity > 0" [items]="items" currency="EUR" [ownerName]="certificateOwner"
            (paymentSuccess)="onPaymentSuccess()">
        </app-paypal-button>
        <button class="clear" (click)="clear()" *ngIf="totalQuantity > 0">{{ t('clear') }}</button>
    </div>
</div>
