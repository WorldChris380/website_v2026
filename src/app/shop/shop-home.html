<div class="shop-page">
    <div class="shop-shell">
        <header class="shop-hero">
            <div>
                <p class="eyebrow">Shop</p>
                <h1>{{ t('pageTitle') }}</h1>
                <p class="lede">{{ t('pageLead') }}</p>
            </div>
        </header>
        <section class="shop-body">
            <p class="hint">{{ t('hint') }}</p>

            <div class="products-grid">
                <article class="product-card featured">
                    <div class="product-header">
                        <p class="eyebrow badge-new">{{ t('badge') }}</p>
                        <h3>{{ t('productTitle') }}</h3>
                    </div>
                    <p class="product-copy">{{ t('productCopy') }}</p>
                    <ul class="product-meta">
                        <li>{{ t('meta1') }}</li>
                        <li>{{ t('meta2') }}</li>
                        <li>{{ t('meta3') }}</li>
                        <li>{{ t('meta4') }}</li>
                    </ul>
                    <div class="product-price">
                        <span class="price">€79,00</span>
                        <span class="stock-indicator">{{ t('stock') }}</span>
                    </div>
                    <div class="product-actions">
                        <a class="secondary" [routerLink]="['/gallery']">{{ t('cta') }}</a>
                    </div>
                </article>
            </div>
        </section>
    </div>
</div>
